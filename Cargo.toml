[package]
name = "ashe-worker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ashe-worker"
path = "src/main.rs"

[[bin]]
name = "ashe-worker-env"
path = "src/bin/env.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"

[target.'cfg(windows)'.dependencies]
base64 = "0.21.7"
cosmic-text = "0.15.0"
crossbeam-channel = "0.5.15"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
  "metrics",
  "logs",
  "internal-logs",
] }
opentelemetry-stdout = "0.33.1"
rand = "0.10.1"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization"] }

[build-dependencies]
embed-resource = "3.0.12"
